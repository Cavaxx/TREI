# Trentino Real Estate Intelligence - Source Registry
# ===================================================
# Single source of truth for which sources exist and how (whether) we may
# acquire them. See docs/data_sources.md and docs/legal_data_access.md.
#
# tier:
#   tier1_api        official / licensed API
#   tier2_feed       authorized feed / partner export
#   tier3_open_data  public open dataset (ISTAT, ISPAT, OMI, ...)
#   tier4_scraping   ordinary web scraping (ONLY after legal check)
#   tier5_restricted restricted - manual import + link only, never bypass
#
# status: OK | WARNING | DEGRADED | LICENSE_REQUIRED | restricted | UNKNOWN
#
# last_verified reflects the automated robots.txt check performed during the
# Phase-1 audit. "UNKNOWN" means an adapter MUST NOT be built until verified.

meta:
  registry_version: "1.0.0"
  last_audit: "2026-10-03"
  audit_method: "robots.txt fetch + ToS/API review; see docs/legal_data_access.md"

sources:
  # ---------------- Portals (asking-price listings) ------------------------
  - name: immobiliare_it
    domain: www.immobiliare.it
    kind: portal
    tier: tier4_scraping
    status: WARNING
    recommended_mode: "licensed API / official feed preferred; scraping only for permitted listing URLs"
    coverage: Trentino
    update_frequency: continuous
    api_public: false
    api_commercial: true
    feed: false
    rss: false
    robots_txt: true
    scraping_allowed: partial
    requires_auth: false
    cost_or_license: "commercial API / data licensing available on request"
    rate_limit: "not stated in robots.txt; enforce >=2s/request"
    quality_estimate: medium
    duplication_risk: high
    last_verified: "2026-10-03"
    notes: "robots.txt allows general listing pages but disallows /dettaglio.php, /ricerca.php, search/map, user areas. Sitemaps at /sitemap.xml. Prefer commercial data feed over scraping."
    # --- Agent Import configuration (data, not code) ------------------------
    # `search_urls` is deliberately EMPTY: the operator adds the exact URLs that
    # robots.txt permits (and that legal has cleared) before any crawl runs. The
    # crawler refuses to start with an empty list rather than guessing an entry
    # point.
    crawl:
      search_urls: []
      url_patterns:
        - "/annunci/[0-9]+"
      id_patterns:
        - "/annunci/([0-9]+)"
      requests_per_minute: 6
      concurrency: 1
      delay_s: 5
      incremental_minutes: 240
    last_verified: "2026-10-03"

