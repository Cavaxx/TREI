    acquisition:
      requires_browser: true
      browser_reason: "TreeView via __doPostBack + __VIEWSTATE; table id and export format still unverified"
      urls:
        - https://statweb.provincia.tn.it/annuario/
      indicators:
        households: "I.26 Numero di famiglie per comunita' di valle (1990-2024)"
        transactions_mortgages: "cap. IX (ex V.07) - to be confirmed live"
      terms_verified: false

