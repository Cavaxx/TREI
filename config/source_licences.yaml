# Trentino Real Estate Intelligence - Licence / Permission Register
# ================================================================
# Records the agreements that authorise AUTOMATED access to a source.
#
# Absolute rule enforced by app/fetchers/licence.py:
#     no active licence record here  ->  no automated request
#
# Where open data suffices (ISTAT, OMI, Agenzia Entrate NTN, Banca d'Italia,
# BCE, Eurostat, ISPAT) no entry is needed: tier-3 sources are covered by their
# own public licence and are fetched through OpenDataAdapter.
#
# Fill an entry in ONLY after a real agreement/authorisation exists. Never add a
# record "to make the adapter run": that would defeat the entire control.
# Runbook: docs/authorized_feeds.md

meta:
  register_version: "1.0.0"
  last_reviewed: "2026-10-03"
  # Credentials are NEVER stored here. They come from the environment
  # (TREI_<SOURCE>_API_KEY, ...) and are resolved by app/fetchers/credentials.py.

licences: []

